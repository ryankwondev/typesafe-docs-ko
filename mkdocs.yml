site_name: TypeSafe 문서 (비공식 한국어 번역)
site_url: https://ryankwondev.github.io/typesafe-docs-ko/
site_description: TypeSafe System One API 문서의 비공식 한국어 번역
copyright: '비공식 한국어 번역본입니다. 원문과 저작권은 TypeSafe에 있습니다: <a href="https://docs.typesafe.ai">docs.typesafe.ai</a>'
docs_dir: docs
theme:
  name: material
  language: ko
  custom_dir: overrides
  features: [navigation.sections, navigation.indexes, navigation.top, navigation.footer, content.code.copy, search.highlight, toc.follow]
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      toggle: {icon: material/weather-night, name: 다크 모드}
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      toggle: {icon: material/weather-sunny, name: 라이트 모드}
markdown_extensions:
  - tables
  - attr_list
  - md_in_html
  - sane_lists
  - toc: {permalink: true}
  - pymdownx.highlight: {anchor_linenums: false}
  - pymdownx.inlinehilite
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
validation: {links: {anchors: ignore}}
